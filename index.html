<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengqing Cao</title>
  <meta name="description" content="Mengqing Cao personal site">
  <link rel="shortcut icon" href="/img/favicon.ico">
  <link rel="stylesheet" href="/css/index.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f7f8fb;
      color: #1f2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, calc(100% - 32px));
      padding: 48px 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 40px;
      line-height: 1.1;
    }

    p {
      margin: 0 auto 28px;
      max-width: 520px;
      color: #5b6472;
      font-size: 17px;
      line-height: 1.7;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 112px;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid #d6dbe3;
      border-radius: 8px;
      color: #1f2933;
      text-decoration: none;
      background: #fff;
    }

    a:hover {
      border-color: #8ea0b8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mengqing Cao</h1>
    <p>Personal site template. Content will be added here later.</p>
    <nav aria-label="Site navigation">
      <a href="/tags/">Tags</a>
      <a href="/categories/">Categories</a>
    </nav>
  </main>
</body>
</html>
